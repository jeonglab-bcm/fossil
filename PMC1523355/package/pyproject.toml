[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stratpower"
version = "0.1.0"
description = "Power of risk-stratified vs conventional subgroup analysis of clinical trials (Hayward et al. 2006)."
readme = "README.md"
# Implemented from the paper's text: the repository's licence.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "fossil contributors (jeonglab-bcm)" }]
dependencies = ["numpy>=2.1,<3"]

[project.scripts]
stratpower = "stratpower.cli:main"

[project.urls]
Reproduction = "https://github.com/jeonglab-bcm/fossil/tree/main/PMC1523355"
Tutorial = "https://github.com/jeonglab-bcm/fossil/blob/main/PMC1523355/package/tutorial/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/stratpower"]
