name: Reproduce PMC2661051

# Reruns the PMC2661051 pipeline (modular gene set enrichment, Ackermann and Strimmer 2009) and
# checks it: the p53 and Hedenfalk inputs are downloaded and their SHA-256 checked; the package
# gseamod is installed from the repository; replicates 1-3 of the simulation study and 6 gene
# sets of each data set are rerun from scratch and must equal the committed p-values; Tables 2-7
# and Figs 2-4 are rebuilt from the committed p-values and compared with the paper;
# check_results.py runs on the fresh results.json; the R package is built and checked and its
# tutorial rendered; and the fresh run is compared with the committed output/ (compare_runs.py).
# Started by hand with full = true, it reruns all 100 replicates and every gene set (about 1.5
# hours on 4 cores) and builds everything from the fresh run.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Rerun all 100 replicates and every gene set (slow)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "PMC2661051/figure-reproduction/**"
      - "PMC2661051/package/**"
      - "PMC2661051/results.json"
      - ".github/workflows/reproduce-pmc2661051.yml"
  push:
    branches: [main]
    paths:
      - "PMC2661051/figure-reproduction/**"
      - "PMC2661051/package/**"
      - "PMC2661051/results.json"
      - ".github/workflows/reproduce-pmc2661051.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 240 || 40 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r PMC2661051/figure-reproduction/requirements.txt

      - name: Install R 4.3.3 and the pinned R packages
        run: bash PMC2661051/figure-reproduction/pipeline/install_r.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: >
          nextflow run PMC2661051/figure-reproduction/main.nf --outdir results -ansi-log false
          --cpus 4 ${{ inputs.full && '--full' || '' }}

      - name: Report
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc2661051-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
