name: Reproduce PMC4015815

# Reruns the PMC4015815 pipeline (SVM-DR and SVM-DT on the 54 SCOP 1.53 families, Figures 3-5,
# Table 1, results.json) and checks it: check_results.py on the fresh results.json, the fresh run
# against the committed output/ (compare_runs.py), and tools/check_results.py on the repository's
# results check.
#
# Pull requests and pushes train at dMAX = 10..200 and read the dMAX = 0 points from the committed
# sweep: on the composition-only kernel Gist's coordinate ascent needs tens of thousands of passes
# (about 2 CPU hours). Start the workflow by hand with dmax_zero = true to train those as well.
# The PSI-BLAST profiles (about 4 CPU hours against the 2016 nrdb90) are read from the committed
# Top-1-gram sequences; rerun them with `--profiles` on a larger machine.
on:
  workflow_dispatch:
    inputs:
      dmax_zero:
        description: "Also train at dMAX = 0 (about 2 CPU hours)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "PMC4015815/figure-reproduction/**"
      - "tools/check_results.py"
      - ".github/workflows/reproduce-pmc4015815.yml"
  push:
    branches: [main]
    paths:
      - "PMC4015815/figure-reproduction/**"
      - "tools/check_results.py"
      - ".github/workflows/reproduce-pmc4015815.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r PMC4015815/figure-reproduction/requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        env:
          DMAX: ${{ github.event.inputs.dmax_zero == 'true' && '0,10,20,40,50,60,80,100,150,200' || '10,20,40,50,60,80,100,150,200' }}
        run: nextflow run PMC4015815/figure-reproduction/main.nf --outdir results --dmax "$DMAX" --workers 4 -ansi-log false

      - name: Check results.json against this run
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 tools/check_results.py PMC4015815/figure-reproduction/results.json results --report results-check | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Write the check report to the job summary
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report. The pipeline stopped before the check step." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc4015815-reproduction
          path: |
            results
            results-check
            .nextflow.log
          include-hidden-files: true
