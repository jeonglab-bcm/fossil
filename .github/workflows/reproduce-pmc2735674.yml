name: Reproduce PMC2735674

# Reruns the PMC2735674 pipeline (Bleakley and Yamanishi 2009, bipartite local models for
# drug-target interaction) on pull requests and pushes to main that touch it, and by hand from the
# Actions tab. The run downloads the benchmark data, recomputes the nuclear-receptor scores, reads
# the committed score matrices for the other three datasets, and rebuilds every table, figure,
# prediction list, score, page and results.json from them. It fails if anything differs from the
# committed outputs or a rule of results.json breaks.
#
# The scores themselves are one support vector machine fit per drug-target pair in each direction,
# about 1.5 million fits over the four datasets, so recomputing all of them (about 6 hours of CPU
# on 4 cores) runs only when started by hand with full = true.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Also recompute every score matrix (long)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "PMC2735674/figure-reproduction/**"
      - "PMC2735674/package/**"
      - "PMC2735674/results.json"
      - ".github/workflows/reproduce-pmc2735674.yml"
  push:
    branches: [main]
    paths:
      - "PMC2735674/figure-reproduction/**"
      - "PMC2735674/package/**"
      - "PMC2735674/results.json"
      - ".github/workflows/reproduce-pmc2735674.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 600 || 45 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the pinned packages and the paper's package
        run: |
          pip install -r PMC2735674/figure-reproduction/requirements.txt
          pip install ./PMC2735674/package

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "25.04.6"

      - name: Run the Nextflow pipeline
        run: nextflow run PMC2735674/figure-reproduction/main.nf --outdir results --cpus 4 -ansi-log false ${{ inputs.full && '--full' || '' }}

      - name: Write the check report to the job summary
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report. The pipeline stopped before the check step." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc2735674-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
