name: Reproduce PMC1847688

# A full rerun of the pipeline, started by hand from the Actions tab, checked against results.json.
# Pull requests that change results.json are checked against the committed outputs instead
# (results-check.yml), without a rerun.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install numpy scipy pandas pillow pywavelets xlrd

      - name: Install GNU Octave (to check the Python port against the authors' MATLAB code)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends octave

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: nextflow run PMC1847688/figure-reproduction/main.nf --outdir results --octave -ansi-log false

      - name: Check results.json against this run
        if: ${{ !cancelled() && hashFiles('PMC1847688/figure-reproduction/results.json') != '' }}
        run: |
          set -o pipefail
          python3 tools/check_results.py PMC1847688/figure-reproduction/results.json results --report results-check | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('PMC1847688/figure-reproduction/results.json') != '' }}
        with:
          name: pmc1847688-results-check
          path: results-check

      - name: Write the check report to the job summary
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report. The pipeline stopped before the check step." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc1847688-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
