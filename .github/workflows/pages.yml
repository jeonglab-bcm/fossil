name: Deploy site

# Publishes site/ with the front page's paper index built from each paper's PMC…/index.json
# (tools/build_index.py). site/index.html is the template; the rows are never committed. The
# Paper2Repro column comes from each paper's skill block in its results.json, so those trigger it too.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "PMC*/index.json"
      - "PMC*/results.json"
      - "PMC*/figure-reproduction/results.json"
      - "tools/build_index.py"
      - "tools/site_versions.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build the front page from PMC…/index.json
        run: |
          cp -r site _site
          python3 tools/build_index.py --out _site/index.html
          python3 tools/check_index_links.py _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
