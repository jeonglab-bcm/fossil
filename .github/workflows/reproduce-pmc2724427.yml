name: Reproduce PMC2724427

# Reruns the PMC2724427 pipeline (Nemes, Jonasson, Genell and Steineck 2009, small-sample bias of
# logistic regression odds ratios; the simulation rebuilt as the R package logitbias) and checks
# it: Additional file 1 and the published figures are downloaded and their SHA-256 checked; the
# study runs in full (281 sample sizes, 1,000 samples each, about 3 minutes on 4 cores); one
# population of the seed spread (seed 1) is rerun and must equal its committed copy, the other 19
# and the hypothesis run come from the committed output/seeds; Figs 1-3 are redrawn on the
# published pixel grid; check_results.py runs on the fresh results.json; the package is built,
# checked and its tutorial rerendered; and the fresh run is compared with the committed output/
# (compare_runs.py). Started by hand with full = true, every population reruns (about 50 minutes).
#
# R comes from Ubuntu 24.04 (R 4.3.3 and its r-cran-* packages), so the renders are drawn with the
# same R, cairo and fonts as the committed ones; lokern is installed from its CRAN source.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Rerun all 20 extra populations and the hypothesis run (about 50 minutes)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "PMC2724427/figure-reproduction/**"
      - "PMC2724427/package/**"
      - "PMC2724427/results.json"
      - ".github/workflows/reproduce-pmc2724427.yml"
  push:
    branches: [main]
    paths:
      - "PMC2724427/figure-reproduction/**"
      - "PMC2724427/package/**"
      - "PMC2724427/results.json"
      - ".github/workflows/reproduce-pmc2724427.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 150 || 40 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install R 4.3.3 and the R packages from Ubuntu 24.04
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends r-base-core r-base-dev r-cran-knitr \
            r-cran-rmarkdown r-cran-testthat pandoc fonts-liberation
          # lokern 1.1-12 and its dependency sfsmisc 1.1-16 from CRAN source, current or archived copy
          for p in sfsmisc_1.1-16 lokern_1.1-12; do
            n=${p%%_*}
            curl -fsSL --retry 3 -o "/tmp/$p.tar.gz" "https://cloud.r-project.org/src/contrib/$p.tar.gz" \
              || curl -fsSL --retry 3 -o "/tmp/$p.tar.gz" "https://cloud.r-project.org/src/contrib/Archive/$n/$p.tar.gz"
            sudo R CMD INSTALL "/tmp/$p.tar.gz"
          done
          sudo R CMD INSTALL PMC2724427/package
          Rscript -e 'cat(R.version.string, "lokern", as.character(packageVersion("lokern")), "\n")'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python packages
        run: pip install -r PMC2724427/figure-reproduction/requirements.txt

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: nextflow run PMC2724427/figure-reproduction/main.nf --outdir results -ansi-log false ${{ inputs.full && '--full' || '' }}

      - name: Report
        if: always()
        run: |
          cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report." >> "$GITHUB_STEP_SUMMARY"
          cat results/check.json >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc2724427-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
