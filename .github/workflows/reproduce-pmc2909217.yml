name: Reproduce PMC2909217

# Reruns the whole PMC2909217 pipeline (synthetic genetic interactions by semi-supervised learning on a
# weighted functional gene network, You et al. 2010) and checks it: the inputs downloaded from SGD's
# archive and checked by SHA-256, the networks and features rebuilt, the cross-validation of Figs 2-5
# (5 repeats, SVM grid searches included), Table 1 and Fig. 6, the hypothesis tests, the figures scored
# against the published ones, the package checked from a fresh install, check_results.py on the fresh
# results.json, and the fresh run against the committed output/ (compare_runs.py). About 15 minutes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "PMC2909217/figure-reproduction/**"
      - "PMC2909217/package/**"
      - "PMC2909217/results.json"
      - ".github/workflows/reproduce-pmc2909217.yml"
  push:
    branches: [main]
    paths:
      - "PMC2909217/figure-reproduction/**"
      - "PMC2909217/package/**"
      - "PMC2909217/results.json"
      - ".github/workflows/reproduce-pmc2909217.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r PMC2909217/figure-reproduction/requirements.txt

      - uses: astral-sh/setup-uv@v6  # check_package.py builds and installs the package with uv

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: nextflow run PMC2909217/figure-reproduction/main.nf --outdir results -ansi-log false

      - name: Report
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc2909217-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
