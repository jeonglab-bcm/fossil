name: Reproduce PMC4457112

# Reruns PMC4457112 (Cohen et al. 2015, the RCT Tagger: confidence that a MEDLINE citation reports a
# randomized controlled trial) and checks it. On every change to its folder: the mini reproduction
# (three PubMed 2026 baseline files downloaded and SHA-256 checked, then every step of the full run on
# them: extraction, dataset, features, forward selection, the eight models of Tables 1-3, scoring)
# compared with the committed output/mini; the committed full run compared with Tables 1-3 and the
# claims; check_results.py on the fresh results.json; the package rctconf built, installed in a fresh
# environment, tested and its tutorial rerun; and the fresh run compared with every committed output,
# results.json and the results page. Started by hand with full = true, it reruns the whole thing from
# the 1,334 baseline files (about 52 GB streamed, 6.3 million citations; about 4 hours on 4 cores).
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Rerun the full reproduction from the whole PubMed baseline (about 4 hours)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "PMC4457112/figure-reproduction/**"
      - "PMC4457112/package/**"
      - "PMC4457112/results.json"
      - "site/PMC4457112/**"
      - ".github/workflows/reproduce-pmc4457112.yml"
  push:
    branches: [main]
    paths:
      - "PMC4457112/figure-reproduction/**"
      - "PMC4457112/package/**"
      - "PMC4457112/results.json"
      - "site/PMC4457112/**"
      - ".github/workflows/reproduce-pmc4457112.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 360 || 40 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages and the package rctconf
        run: pip install -r PMC4457112/figure-reproduction/requirements.txt ./PMC4457112/package

      - uses: astral-sh/setup-uv@v6  # check_package.py builds and installs the package with uv

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: nextflow run PMC4457112/figure-reproduction/main.nf --outdir results -ansi-log false ${{ inputs.full && '--full' || '' }}

      - name: Report
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc4457112-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
