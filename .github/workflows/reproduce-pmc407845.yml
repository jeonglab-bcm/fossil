name: Reproduce PMC407845

# Reruns the whole PMC407845 pipeline (MA-Networker, Gao, Foat and Bussemaker 2004) and checks it:
# the inputs are downloaded and their SHA-256 checked; backward selection, activity profiles,
# coupling, Table 1, the validation analyses and the figures are recomputed; check_results.py runs
# on the fresh results.json; the package is built and tested in a fresh environment and its
# tutorial rerun; and the fresh run is compared with the committed output/ (compare_runs.py).
# Everything runs in a few minutes, so nothing is left to a manual run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "PMC407845/figure-reproduction/**"
      - "PMC407845/package/**"
      - "PMC407845/results.json"
      - ".github/workflows/reproduce-pmc407845.yml"
  push:
    branches: [main]
    paths:
      - "PMC407845/figure-reproduction/**"
      - "PMC407845/package/**"
      - "PMC407845/results.json"
      - ".github/workflows/reproduce-pmc407845.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r PMC407845/figure-reproduction/requirements.txt

      - uses: astral-sh/setup-uv@v6  # check_package.py builds and installs the package with uv

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: nextflow run PMC407845/figure-reproduction/main.nf --outdir results -ansi-log false

      - name: Report
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc407845-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
