name: Reproduce PMC4081639

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "PMC4081639/figure-reproduction/**"
      - ".github/workflows/reproduce.yml"
  push:
    branches: [main]
    paths:
      - "PMC4081639/figure-reproduction/**"
      - ".github/workflows/reproduce.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install LaTeX and Poppler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-pictures preview-latex-style poppler-utils

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("ggplot2", "tikzDevice", "jsonlite", "microbenchmark"))'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install numpy scipy mpmath==1.3.0 pillow

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: nextflow run PMC4081639/figure-reproduction/main.nf --outdir results -ansi-log false

      - name: Write the check report to the job summary
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report. The pipeline stopped before the check step." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc4081639-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
