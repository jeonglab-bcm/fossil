name: Reproduce PMC1955447

# Reruns the PMC1955447 pipeline (Moineddin, Matheson and Glazier 2007, sample size for multilevel logistic
# regression; the SAS PROC NLMIXED simulation rebuilt as the Python package mlagq) and checks it: the article XML
# is downloaded and its SHA-256 checked; the first 3 replicates of every cell of Tables 1-5 (378 data sets) are
# simulated and fitted again from scratch and checked against the committed per-replicate records; every printed
# quantity is recomputed from those records and compared with the paper; the text's tests are rerun; mlagq's
# likelihood is checked against direct numerical integration; check_results.py runs on the fresh results.json;
# the package mlagq is built and tested in a fresh environment and its tutorial rerun; and the fresh run is
# compared with the committed outputs, results.json, figure-reproduction/results.json and the page.
# About 10 minutes on a standard runner. The whole simulation study (about 6 CPU hours) runs only when started by
# hand with `full`.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Rerun the whole simulation study, the second run and the variants (about 3 hours)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "PMC1955447/figure-reproduction/**"
      - "PMC1955447/package/**"
      - "PMC1955447/results.json"
      - "site/PMC1955447/**"
      - ".github/workflows/reproduce-pmc1955447.yml"
  push:
    branches: [main]
    paths:
      - "PMC1955447/figure-reproduction/**"
      - "PMC1955447/package/**"
      - "PMC1955447/results.json"
      - "site/PMC1955447/**"
      - ".github/workflows/reproduce-pmc1955447.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 360 || 30 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages and the package mlagq
        run: pip install -r PMC1955447/figure-reproduction/requirements.txt ./PMC1955447/package

      - uses: astral-sh/setup-uv@v6  # check_package.py builds and installs the package with uv

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: nextflow run PMC1955447/figure-reproduction/main.nf --outdir results -ansi-log false --jobs 4 ${{ inputs.full && '--full' || '' }}

      - name: Report
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc1955447-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
