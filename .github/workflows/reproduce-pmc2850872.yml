name: Reproduce PMC2850872

# Reruns the PMC2850872 pipeline (Yu et al. 2010, SVM prediction of diabetes on NHANES 1999-2004)
# on every pull request and push to main that touches this reproduction, and by hand from the
# Actions tab.
#
# The pull-request run downloads the NHANES files, rebuilds the cohort, refits every model of the
# 10 splits with the C and gamma of the committed grid search (output/grid.csv), checks our method
# against R (survey, pROC, e1071), checks the package, and fails if anything differs from the
# committed outputs or results.json. About 10 minutes. grid.py's search itself (about 80 minutes on
# 4 cores) runs only when started by hand with search = true.
on:
  workflow_dispatch:
    inputs:
      search:
        description: "Also rerun grid.py's search for C and gamma (about 80 minutes)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "PMC2850872/**"
      - "tools/paper2repro/**"
      - ".github/workflows/reproduce-pmc2850872.yml"
  push:
    branches: [main]
    paths:
      - "PMC2850872/**"
      - "tools/paper2repro/**"
      - ".github/workflows/reproduce-pmc2850872.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.search && 240 || 40 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r PMC2850872/figure-reproduction/requirements.txt ./PMC2850872/package

      - uses: astral-sh/setup-uv@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.3.3"
          use-public-rspm: true

      - name: Install R packages
        run: Rscript -e 'install.packages(c("survey", "pROC", "e1071", "jsonlite"))'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: nextflow run PMC2850872/figure-reproduction/main.nf --outdir results -ansi-log false ${{ inputs.search && '--search' || '' }}

      - name: Write the check report to the job summary
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report. The pipeline stopped before the check step." >> "$GITHUB_STEP_SUMMARY"

      - name: Check figure-reproduction/results.json against this run
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          python3 tools/check_results.py PMC2850872/figure-reproduction/results.json results --report results-check | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc2850872-reproduction
          path: |
            results
            results-check
            .nextflow.log
          include-hidden-files: true
