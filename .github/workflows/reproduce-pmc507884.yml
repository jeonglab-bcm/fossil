name: Reproduce PMC507884

# Reruns the PMC507884 pipeline (statistical models for selecting housekeeper genes, Szabo et al.
# 2004) and checks it: the breast cancer data, Vandesompele et al.'s data and the R file of Fig. 3
# are downloaded and their SHA-256 checked; the package hkselect is installed from the repository;
# every model is fitted and every table, claim and figure redone and compared with the paper (Figs
# 1-3 drawn on the published pixel grid and scored with negative controls); check_results.py runs
# on the fresh results.json; the R package is built and checked and its tutorial rendered; and the
# fresh run is compared with the committed output/ (compare_runs.py). Started by hand with full =
# true, it also reruns the variant fits behind Table 3's cause (about 100 fits, 6 minutes on 4 cores).
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Also rerun the variant fits behind Table 3's cause"
        type: boolean
        default: false
  pull_request:
    paths:
      - "PMC507884/figure-reproduction/**"
      - "PMC507884/package/**"
      - "PMC507884/results.json"
      - ".github/workflows/reproduce-pmc507884.yml"
  push:
    branches: [main]
    paths:
      - "PMC507884/figure-reproduction/**"
      - "PMC507884/package/**"
      - "PMC507884/results.json"
      - ".github/workflows/reproduce-pmc507884.yml"

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.full && 60 || 30 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: pip install -r PMC507884/figure-reproduction/requirements.txt

      - name: Install R 4.3.3 and the pinned R packages
        run: bash PMC507884/figure-reproduction/pipeline/install_r.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.3"

      - name: Run the Nextflow pipeline
        run: >
          nextflow run PMC507884/figure-reproduction/main.nf --outdir results -ansi-log false
          --cpus 4 ${{ inputs.full && '--full' || '' }}

      - name: Report
        if: always()
        run: cat results/report.md >> "$GITHUB_STEP_SUMMARY" || echo "No report." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pmc507884-reproduction
          path: |
            results
            .nextflow.log
          include-hidden-files: true
