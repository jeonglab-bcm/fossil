[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gecon"
version = "0.1.0"
description = "GeCON: signed gene co-expression networks from local expression patterns (Roy, Bhattacharyya and Kalita 2014), reimplemented from the paper."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "fossil contributors" }]
dependencies = ["numpy>=2.1,<3"]

[project.scripts]
gecon = "gecon.cli:main"

[project.urls]
Reproduction = "https://github.com/jeonglab-bcm/fossil/tree/main/PMC4110735"
Tutorial = "https://github.com/jeonglab-bcm/fossil/blob/main/PMC4110735/package/tutorial/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/gecon"]
