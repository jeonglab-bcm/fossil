# Pinned environment of the PMC3446288 reproduction (micromamba / conda). CI creates it with
# mamba-org/setup-micromamba; locally: micromamba create -f environment.yml
name: pmc3446288
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.16
  - bowtie=1.0.0
  - samtools=1.25
  - sra-tools=3.4.1
  - r-base=4.4.3
  - bioconductor-edger=4.4.0
  - numpy=2.5.5
  - pandas=3.1.1
  - scipy=1.18.1
  - matplotlib=3.11.2
  - pillow=13.0.0
  - pysam=0.24.1
  - openpyxl=3.1.5
  - xlrd=2.0.2
  - nbformat=5.11.1
  - nbclient=0.11.0
  - ipykernel=7.4.0
  - pytest=9.2.0
  - uv=0.13.9
  - hatchling=1.33.0
