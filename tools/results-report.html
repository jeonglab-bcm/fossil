<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__PAPER__ results check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@700&family=Instrument+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap">
<style>
/* fossil results check: the Dose tokens of site/tokens.css, inlined so the report stands alone. */
:root {
  --color-paper: oklch(97.6% 0.011 88); --color-surface: oklch(99.5% 0.005 88);
  --color-ink: oklch(21% 0.025 170); --color-ink-2: oklch(31% 0.02 170); --color-muted: oklch(49% 0.024 165);
  --color-rule: oklch(86.5% 0.022 140); --color-accent: oklch(50% 0.13 160); --color-accent-deep: oklch(42% 0.11 162);
  --color-accent-soft: oklch(88% 0.08 160);
  --font-display: "Schibsted Grotesk", ui-sans-serif, sans-serif; --font-body: "Instrument Sans", ui-sans-serif, sans-serif;
  --font-outlier: "DM Mono", ui-monospace, monospace;
  --radius-card: 14px; --shadow-lift: 0 1px 1px oklch(30% 0.03 165 / 0.10), 8px 18px 28px -14px oklch(36% 0.06 165 / 0.32);
}
html, body { overflow-x: clip; }
body { margin: 0; background: var(--color-paper); color: var(--color-ink); font: 400 16px/1.5 var(--font-body); }
main { max-width: 1200px; margin: 0 auto; padding: 48px 24px 64px; }
h1 { font: 700 clamp(2rem, 3vw + 1rem, 3.25rem)/1.05 var(--font-display); letter-spacing: -0.03em; margin: 0 0 12px; overflow-wrap: break-word; min-width: 0; }
.lead { font-size: 1.25rem; color: var(--color-ink-2); margin: 0 0 8px; }
.meta { font: 400 0.8125rem/1.4 var(--font-outlier); color: var(--color-muted); margin: 0 0 32px; }
.key { display: flex; flex-wrap: wrap; gap: 8px 24px; margin: 0 0 16px; font-size: 0.875rem; color: var(--color-ink-2); }
.k { display: inline-block; margin-right: 6px; vertical-align: -2px; }
.k--exp { width: 10px; height: 10px; border: 2px solid var(--color-ink); border-radius: 50%; }
.k--obs { width: 12px; height: 12px; background: var(--color-accent); border-radius: 50%; }
.k--band { width: 18px; height: 10px; background: color-mix(in oklab, var(--color-accent) 22%, transparent); border-radius: 2px; }
.sheet { background: var(--color-surface); border-radius: var(--radius-card); box-shadow: var(--shadow-lift); padding: 8px 24px; overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font: 400 0.8125rem/1.3 var(--font-body); color: var(--color-muted); padding: 12px 12px 8px 0; border-bottom: 1px solid var(--color-rule); }
td { padding: 12px 12px 12px 0; border-bottom: 1px solid var(--color-rule); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { font-family: var(--font-outlier); font-variant-numeric: tabular-nums; font-size: 0.875rem; white-space: nowrap; }
.src { display: block; font: 400 0.75rem/1.3 var(--font-outlier); color: var(--color-muted); margin-top: 2px; }
.state { font: 500 0.875rem/1 var(--font-outlier); white-space: nowrap; }
.state[data-status="pass"] { color: var(--color-accent-deep); }
.state[data-status="fail"], .state[data-status="missing"] { color: var(--color-ink); text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
tr[data-status="fail"] td, tr[data-status="missing"] td { background: color-mix(in oklab, var(--color-ink) 4%, transparent); }
.strip svg { display: block; }
.strip .axis { stroke: var(--color-rule); stroke-width: 1; }
.strip .band { fill: color-mix(in oklab, var(--color-accent) 22%, transparent); }
.strip .exp { fill: var(--color-surface); stroke: var(--color-ink); stroke-width: 2; }
.strip .obs { fill: var(--color-accent); stroke: var(--color-surface); stroke-width: 1.5; }
.strip .off { stroke: var(--color-ink); stroke-width: 1.5; }
@media (max-width: 40rem) { main { padding: 32px 16px 48px; } .sheet { padding: 4px 12px; } }
</style>
</head>
<body>
<main>
  <h1>__PAPER__, checked.</h1>
  <p class="lead">__SUMMARY__</p>
  <p class="meta">__TITLE__</p>
  <p class="key"><span><i class="k k--exp"></i>Expected, from results.json</span><span><i class="k k--obs"></i>__OBSERVED__</span><span><i class="k k--band"></i>Allowed gap</span></p>
  <div class="sheet">
    <table>
      <thead><tr><th scope="col">Result</th><th scope="col" class="num">Expected</th><th scope="col" class="num">__OBSERVED__</th><th scope="col" class="num">Gap</th><th scope="col" class="num">Allowed</th><th scope="col">Expected and observed</th><th scope="col">Status</th></tr></thead>
      <tbody>
__ROWS__
      </tbody>
    </table>
  </div>
</main>
<script id="results" type="application/json">__DATA__</script>
<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("results").textContent), NS = "http://www.w3.org/2000/svg";
  var W = 220, H = 30;
  function el(name, attrs, parent) {
    var e = document.createElementNS(NS, name);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function allowed(e, tol) { tol = tol || {}; return Math.max(tol.abs || 0, (tol.rel || 0) * Math.abs(e)); }

  // One number: the allowed gap as a wash around the expected value, the observed value as a dot.
  function scalar(svg, e, o, tol) {
    var a = allowed(e, tol), half = Math.max(2 * a, 1.25 * Math.abs(o - e));
    if (!(half > 0)) half = Math.abs(e) * 0.05 || 1;
    var x = function (v) { return 12 + (v - (e - half)) / (2 * half) * (W - 24); };
    el("line", { x1: 4, x2: W - 4, y1: H / 2, y2: H / 2, class: "axis" }, svg);
    if (a > 0) el("rect", { x: x(e - a), y: H / 2 - 6, width: Math.max(1, x(e + a) - x(e - a)), height: 12, rx: 3, class: "band" }, svg);
    el("circle", { cx: x(e), cy: H / 2, r: 6, class: "exp" }, svg);
    el("circle", { cx: x(o), cy: H / 2, r: 4, class: "obs" }, svg);
  }

  // A list of numbers: each item's expected ring and observed dot on one shared scale.
  function vector(svg, e, o, tol) {
    var all = e.concat(o), lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (hi === lo) { hi += 1; lo -= 1; }
    var n = e.length, x = function (i) { return n === 1 ? W / 2 : 10 + i * (W - 20) / (n - 1); };
    var y = function (v) { return H + 10 - 6 - (v - lo) / (hi - lo) * (H + 10 - 12); };
    svg.setAttribute("height", H + 10);
    e.forEach(function (ev, i) {
      if (Math.abs(o[i] - ev) > allowed(ev, tol)) el("line", { x1: x(i), x2: x(i), y1: y(ev), y2: y(o[i]), class: "off" }, svg);
      el("circle", { cx: x(i), cy: y(ev), r: 4.5, class: "exp" }, svg);
      el("circle", { cx: x(i), cy: y(o[i]), r: 3, class: "obs" }, svg);
    });
  }

  document.querySelectorAll("td.strip").forEach(function (td) {
    var r = D.results[+td.dataset.i], e = r.expected, o = r.observed;
    var svg = el("svg", { width: W, height: H, role: "img", "aria-label": r.label + ": expected " + JSON.stringify(e) + ", observed " + JSON.stringify(o) });
    if (isNum(e) && isNum(o)) scalar(svg, e, o, r.tolerance);
    else if (Array.isArray(e) && Array.isArray(o) && e.length === o.length && e.every(isNum) && o.every(isNum)) vector(svg, e, o, r.tolerance);
    else return;
    td.appendChild(svg);
  });
})();
</script>
</body>
</html>
