[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
# Name the distribution and the import package after the method, not the paper ID.
name = "pssmdt"
version = "0.1.0"
description = "PSSM distance transformation (PSSM-DT) and SVM-PSSM-DT for identifying DNA-binding proteins (Xu et al. 2015)."
readme = "README.md"
# Implemented from the paper's text: the repository's licence. Ported from the authors' code: that code's licence.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "fossil reproductions (jeonglab-bcm)" }]
# Compatible ranges with the tested versions as floors, for example "numpy>=2.1,<3".
# Exact pins belong in the reproduction pipeline's requirements.txt, not here.
dependencies = ["numpy>=2.1,<3", "scikit-learn>=1.5,<2"]

[project.scripts]
pssmdt = "pssmdt.cli:main"

[project.urls]
Reproduction = "https://github.com/jeonglab-bcm/fossil/tree/main/PMC4331676"
Tutorial = "https://github.com/jeonglab-bcm/fossil/blob/main/PMC4331676/package/tutorial/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/pssmdt"]
