[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "spsvm"
version = "0.1.0"
description = "Zinc-binding residues from PSI-BLAST profiles with the SP-SVM of Passerini et al. (2007)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "fossil contributors (jeonglab-bcm)" }]
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2", "scikit-learn>=1.5,<2"]

[project.scripts]
spsvm = "spsvm.cli:main"

[project.urls]
Reproduction = "https://github.com/jeonglab-bcm/fossil/tree/main/PMC1800866"
Tutorial = "https://github.com/jeonglab-bcm/fossil/blob/main/PMC1800866/package/tutorial/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/spsvm"]
