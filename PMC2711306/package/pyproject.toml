[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "geodenoise"
version = "0.1.0"
description = "Geometric de-noising of protein-protein interaction networks (Kuchaiev et al. 2009): embed a network, predict missing interactions and score every close pair."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "fossil reproduction (jeonglab-bcm)" }]
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2"]

[project.scripts]
geodenoise = "geodenoise.cli:main"

[project.urls]
Reproduction = "https://github.com/jeonglab-bcm/fossil/tree/main/PMC2711306"
Tutorial = "https://github.com/jeonglab-bcm/fossil/blob/main/PMC2711306/package/tutorial/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/geodenoise"]
