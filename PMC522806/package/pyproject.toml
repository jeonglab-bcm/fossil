[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cfsenn"
version = "0.1.0"
description = "Combinational feature selection and ensemble neural networks for classifying expression data (Liu, Cui, Jiang and Ma 2004)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "fossil contributors (jeonglab-bcm)" }]
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2"]

[project.scripts]
cfsenn = "cfsenn.cli:main"

[project.urls]
Reproduction = "https://github.com/jeonglab-bcm/fossil/tree/main/PMC522806"
Tutorial = "https://github.com/jeonglab-bcm/fossil/blob/main/PMC522806/package/tutorial/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/cfsenn"]
