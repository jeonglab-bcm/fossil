[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "rfld"
version = "0.1.0"
description = "Random forest importance for SNPs in linkage disequilibrium: the revised tree builder (RF1) and importance (IM1) of Meng et al. (2009)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "fossil contributors (jeonglab-bcm)" }]
dependencies = ["numpy>=2.0,<3", "numba>=0.60,<1"]

[project.scripts]
rfld = "rfld.cli:main"

[project.urls]
Reproduction = "https://github.com/jeonglab-bcm/fossil/tree/main/PMC2666661"
Tutorial = "https://github.com/jeonglab-bcm/fossil/blob/main/PMC2666661/package/tutorial/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/rfld"]
