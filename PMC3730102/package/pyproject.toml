[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "condloc"
version = "0.1.0"
description = "Conditional protein location maps from sequence, interaction networks and expression (CoLP, Lee et al. 2013)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "fossil contributors (jeonglab-bcm)" }]
dependencies = ["numpy>=2.0,<3", "scipy>=1.13,<2"]

[project.scripts]
condloc = "condloc.cli:main"

[project.urls]
Reproduction = "https://github.com/jeonglab-bcm/fossil/tree/main/PMC3730102"
Tutorial = "https://github.com/jeonglab-bcm/fossil/blob/main/PMC3730102/package/tutorial/TUTORIAL.md"

[tool.hatch.build.targets.wheel]
packages = ["src/condloc"]
